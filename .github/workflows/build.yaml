name: build
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
        enable:
          - PROCESS_AGENT=0 SECURITY_AGENT=0 TRACE_AGENT=0 BUILD_INTEGRATIONS_BUILDER=1
          - PROCESS_AGENT=1 SECURITY_AGENT=0 TRACE_AGENT=0
          - PROCESS_AGENT=1 SECURITY_AGENT=0 TRACE_AGENT=1
          - PROCESS_AGENT=1 SECURITY_AGENT=1 TRACE_AGENT=1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment variables
        run: |
          echo ${{ matrix.enable }} \
            | xargs -n1 echo \
            | xargs -n1 -I{} echo ENABLE_{} >> ${GITHUB_ENV}

      - name: Cache docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/layer-cache
          key: layer-cache-${{ matrix.arch.platform }}-${{ matrix.enable }}-${{ hashFiles('*Dockerfile') }}
          restore-keys: |
            layer-cache-${{ matrix.arch.platform }}-${{ matrix.enable }}-
            layer-cache-${{ matrix.arch.platform }}-

      - name: Get image tag
        id: tag
        run: make show-image-tag
      - name: Prepare cache and pull latest release to reuse layers
        uses: seqsense/sq-actions/buildx-pull@main
        id: layer-cache
        with:
          IMAGES: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.tag.outputs.tag }}-integrations-builder

      - name: Set up Docker Buildx for enabling cache exporters
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Build images
        timeout-minutes: 45
        env:
          BUILDX_OPTS: >-
            ${{ steps.layer-cache.outputs.buildx-opts }}
            --cache-from type=local,src=/tmp/layer-cache/main
            --cache-to type=local,mode=max,dest=/tmp/layer-cache/main
        run: make docker-build BUILD_OPTS="${BUILD_OPTS}"
      - name: Embed inline cache
        timeout-minutes: 5
        env:
          BUILDX_OPTS: >-
            --load
            --cache-from type=local,src=/tmp/layer-cache/main
            --cache-to type=inline
        run: make docker-build BUILD_OPTS="${BUILD_OPTS}"
      - name: Get image tag
        id: full-tag
        run: |
          make show-image-full-tag
          make show-image-full-tag-with-alpine-version

      - name: Build integrations-builder
        if: env.ENABLE_BUILD_INTEGRATIONS_BUILDER == 1
        env:
          BUILDX_OPTS: >-
            --build-arg BASE_IMAGE_PREFIX=${{ steps.layer-cache.outputs.registry-addr }}/
            ${{ steps.layer-cache.outputs.buildx-opts }}
            --cache-from type=local,src=/tmp/layer-cache/main
            --cache-from type=local,src=/tmp/layer-cache/integ
            --cache-to type=local,mode=max,dest=/tmp/layer-cache/integ
        run: |
          docker tag \
            ${{ steps.tag.outputs.tag }} \
            ${{ steps.layer-cache.outputs.registry-addr }}/${{ steps.tag.outputs.tag }}
          docker push ${{ steps.layer-cache.outputs.registry-addr }}/${{ steps.tag.outputs.tag }}
          make docker-build-integrations-builder
      - name: Embed inline cache to integrations-builder
        if: env.ENABLE_BUILD_INTEGRATIONS_BUILDER == 1
        env:
          BUILDX_OPTS: >-
            --load
            --build-arg BASE_IMAGE_PREFIX=${{ steps.layer-cache.outputs.registry-addr }}/
            --cache-from type=local,src=/tmp/layer-cache/integ
            --cache-to type=inline
        run: make docker-build-integrations-builder

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag \
            ${{ steps.tag.outputs.tag }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag }}-${{ matrix.arch.platform }}
          docker push --platform linux/${{ matrix.arch.platform }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag }}-${{ matrix.arch.platform }}
          docker tag \
            ${{ steps.tag.outputs.tag }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag_with_alpine_version }}-${{ matrix.arch.platform }}
          docker push --platform linux/${{ matrix.arch.platform }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag_with_alpine_version }}-${{ matrix.arch.platform }}
          docker tag \
            ${{ steps.tag.outputs.tag }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.tag.outputs.tag }}-${{ matrix.arch.platform }}
          docker push --platform linux/${{ matrix.arch.platform }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.tag.outputs.tag }}-${{ matrix.arch.platform }}

      - name: Deploy integrations-builder
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.ENABLE_BUILD_INTEGRATIONS_BUILDER == 1
        run: |
          docker tag \
            ${{ steps.tag.outputs.tag }}-integrations-builder \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag }}-integrations-builder-${{ matrix.arch.platform }}
          docker push --platform linux/${{ matrix.arch.platform }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag }}-integrations-builder-${{ matrix.arch.platform }}
          docker tag \
            ${{ steps.tag.outputs.tag }}-integrations-builder \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag_with_alpine_version }}-integrations-builder-${{ matrix.arch.platform }}
          docker push --platform linux/${{ matrix.arch.platform }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.full-tag.outputs.full_tag_with_alpine_version }}-integrations-builder-${{ matrix.arch.platform }}

      - name: Save tags to create manifest lists
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.arch.platform == 'amd64'
        run: |
          {
            echo ${{ steps.full-tag.outputs.full_tag }}
            echo ${{ steps.full-tag.outputs.full_tag_with_alpine_version }}
            echo ${{ steps.tag.outputs.tag }}
            if [ "${ENABLE_BUILD_INTEGRATIONS_BUILDER}" = 1 ]; then
              echo ${{ steps.full-tag.outputs.full_tag }}-integrations-builder
              echo ${{ steps.full-tag.outputs.full_tag_with_alpine_version }}-integrations-builder
            fi
          } > tags-${{ strategy.job-index }}.txt
      - name: Upload tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.arch.platform == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: tags-${{ strategy.job-index }}
          path: tags-${{ strategy.job-index }}.txt

      - name: Notify failure
        uses: seqsense/sq-actions/notify-branch-build@main
        if: failure() && github.event_name == 'push'
        with:
          title: ":x: Release failed"

  manifest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download tags
        uses: actions/download-artifact@v8
        with:
          pattern: tags-*
          merge-multiple: true
      - name: Create manifest lists
        run: |
          for tag in $(cat tags-*.txt); do
            image=ghcr.io/${{ github.repository_owner }}/${tag}
            docker manifest create --amend ${image} ${image}-amd64 ${image}-arm64
            docker manifest push --purge ${image}
          done

      - name: Notify failure
        uses: seqsense/sq-actions/notify-branch-build@main
        if: failure() && github.event_name == 'push'
        with:
          title: ":x: Release failed"
